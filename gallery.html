<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body{
            background: url('maroon background.jpg');
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-weight: bold;
            font-size: 25px;
        }

        h1{
            color: white;
            background: rgba(255, 192, 203, 0.5);
            margin-top: 30px;
        }

        .gallery{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .gallery img{
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .button{
            display: inline-block;
            margin-top: 40px;
            padding: 12px 30px;
            background: #b76572;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }
    </style>
</head>
