<html>
  <head>
   <title>Floating Buttons</title>

<style>
  body {
    margin: 0;
    padding:0;
    height: 100vh;
background-image: url('maroon background.jpg');
background-size: cover;
background-position: center;

font-family: Arial, sans-serif;
  } 
  .button-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 50px;

  position: absolute;
  top: 55%;
  left: 50%;
  bottom: 90%;
  transform: translate(-50%, -50%);

  .square-button {
    width: 200px;
    height: 100px;
    background-color:blue;
    color: white;

background: rgba(255, 192, 203, 0.5);
    border: 2px solid white;
    border-radius: 20px;
    color: burlywood;
    font-size: 30px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.3s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  }
  .square-button:hover {
    transform:translateY(-10px);
    background-color: brown;
  }

</style>
<div class="button-container">
  <a href="about.html">
    <div class="square-button">ABOUT ME</div>
  </a>

  <a href="gallery.html">
    <div class="square-button">GALLERY</div>
  </a>

  <a href="video.html">
    <div class="square-button">VIDEO</div>
  </a>

  <a href="contact.html">
    <div class="square-button">CONTACT</div>
  </a>

  
  

  </body>
</html>
